<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CineMax Movie</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">CINE<span>MAX</span></div><nav><a href="index.html">Home</a><a href="watchlist.html">Watchlist</a><a href="profile.html">Profile</a></nav></header><main class="movie-page"><div id="movie"></div></main><div class="toast" id="toast"></div><script>
const id=new URLSearchParams(location.search).get("id"),token=localStorage.getItem("cinemax_token");async function load(){const r=await fetch("/api/movies/"+id),m=await r.json();document.getElementById("movie").innerHTML=`<section class="detail-hero" style="background-image:linear-gradient(90deg,#08090d 15%,transparent),url('${m.backdrop}')"><div><span class="eyebrow">${m.genre.toUpperCase()}</span><h1>${m.title}</h1><p>${m.year} • ★ ${m.rating}</p><p>${m.description}</p><button class="primary" onclick="watch()">▶ Watch Now</button><button class="secondary" onclick="fav()">♡ Add to Watchlist</button></div></section>`};async function fav(){if(!token)return location.href="index.html";await fetch("/api/favorites/"+id,{method:"POST",headers:{Authorization:"Bearer "+token}});toast("Added to watchlist")}function watch(){alert("Connect this button to a licensed movie/trailer video URL in the admin dashboard.")}function toast(x){document.getElementById("toast").textContent=x;document.getElementById("toast").classList.add("show")}load();</script></body></html>
