<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineMax | Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span>CINE</span>MAX</a><nav class="desktop-nav"><a href="index.html">Site</a><a href="profile.html">Profile</a></nav><button class="login-pill" id="logout">Logout</button></header><main><section class="content-section"><span class="kicker">CONTROL CENTER</span><h1>Admin Dashboard</h1><div class="stats" id="stats"></div></section><section class="admin-box"><span class="kicker">CONTENT</span><h2 id="formTitle">Add Movie</h2><form id="movieForm"><input id="title" placeholder="Title" required><input id="year" type="number" placeholder="Year" required><input id="genre" placeholder="Genre" required><input id="rating" type="number" min="0" max="10" step=".1" placeholder="Rating" required><input id="poster" placeholder="Poster URL" required><input id="backdrop" placeholder="Backdrop URL" required><input id="video_url" placeholder="Authorized video/trailer URL"><textarea id="description" placeholder="Description" required></textarea><label><input id="featured" type="checkbox"> Featured</label><button class="primary" id="saveMovie">Add Movie</button><button type="button" class="ghost" id="cancelEdit" hidden>Cancel Edit</button></form></section><section class="admin-box"><span class="kicker">MOVIE LIBRARY</span><div id="movies"></div></section><section class="admin-box"><span class="kicker">USERS</span><div id="users"></div></section></main><script>
const token=localStorage.getItem("cinemax_token");if(!token)location.href="login.html";const h={Authorization:"Bearer "+token};let editing=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...h,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||"Request failed");return d}
async function load(){try{const s=await api("/api/admin/stats");stats.innerHTML="<div>Users<b>"+s.users+"</b></div><div>Movies<b>"+s.movies+"</b></div><div>Watchlist<b>"+s.watchlist+"</b></div><div>Reviews<b>"+s.reviews+"</b></div>";const [ms,us]=await Promise.all([api("/api/movies"),api("/api/admin/users")]);movies.innerHTML=ms.map(m=>'<div class="admin-row"><div><b>'+esc(m.title)+'</b><span>'+m.year+' • '+esc(m.genre)+' • ★ '+m.rating+'</span></div><div><button onclick="editMovie('+m.id+')">Edit</button><button onclick="deleteMovie('+m.id+')">Delete</button></div></div>').join("");const me=JSON.parse(localStorage.getItem("cinemax_user")||"{}");users.innerHTML=us.map(u=>'<div class="admin-row"><div><b>'+esc(u.name)+'</b><span>'+esc(u.email)+' • '+u.role+'</span></div><div>'+(u.id!==me.id?'<button onclick="toggleRole('+u.id+',\''+(u.role==="admin"?"user":"admin")+'\')">'+(u.role==="admin"?"Make User":"Make Admin")+'</button><button onclick="deleteUser('+u.id+')">Delete</button>':"Current account")+'</div></div>').join("")}catch(e){document.body.innerHTML="<main><section class='profile-box'><h1>"+esc(e.message)+"</h1><a class='primary' href='index.html'>Back to CineMax</a></section></main>"}}
async function editMovie(id){const m=await api("/api/movies/"+id);editing=id;["title","year","genre","rating","poster","backdrop","video_url","description"].forEach(k=>document.getElementById(k).value=m[k]??"");featured.checked=!!m.featured;formTitle.textContent="Edit Movie";saveMovie.textContent="Save Changes";cancelEdit.hidden=false;scrollTo({top:0,behavior:"smooth"})}
function resetForm(){editing=null;movieForm.reset();formTitle.textContent="Add Movie";saveMovie.textContent="Add Movie";cancelEdit.hidden=true}
movieForm.onsubmit=async e=>{e.preventDefault();const b={title:title.value,year:+year.value,genre:genre.value,rating:+rating.value,poster:poster.value,backdrop:backdrop.value,video_url:video_url.value,description:description.value,featured:featured.checked};try{await api(editing?"/api/admin/movies/"+editing:"/api/admin/movies",{method:editing?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});resetForm();load()}catch(x){alert(x.message)}};
cancelEdit.onclick=resetForm;
async function deleteMovie(id){if(!confirm("Delete this movie?"))return;try{await api("/api/admin/movies/"+id,{method:"DELETE"});load()}catch(e){alert(e.message)}}
async function toggleRole(id,role){try{await api("/api/admin/users/"+id+"/role",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({role})});load()}catch(e){alert(e.message)}}
async function deleteUser(id){if(!confirm("Delete this user?"))return;try{await api("/api/admin/users/"+id,{method:"DELETE"});load()}catch(e){alert(e.message)}}
logout.onclick=()=>{localStorage.clear();location.href="index.html"};load();
</script></body></html>
