<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CineMax | Login</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><a class="auth-logo" href="index.html">CINE<span>MAX</span></a><main class="auth-screen"><div class="auth-card"><div class="auth-kicker">WELCOME BACK</div><h1>Sign in to CineMax</h1><p>Continue watching and manage your personal watchlist.</p><form id="loginForm"><label>Email<input id="email" type="email" placeholder="you@example.com" required></label><label>Password<input id="password" type="password" placeholder="Your password" required></label><button class="primary" type="submit">Login</button></form><div class="auth-divider"><span>OR</span></div><button class="google-btn" type="button" disabled>Continue with Google</button><p class="switch-auth">Don't have an account? <a href="signup.html">Sign Up</a></p><a class="back-home" href="index.html">← Back to CineMax</a></div></main><script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Login failed');localStorage.setItem('cinemax_token',d.token);localStorage.setItem('cinemax_user',JSON.stringify(d.user));location.href='index.html'}catch(err){alert(err.message)}};</script></body></html>
