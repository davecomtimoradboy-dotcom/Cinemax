name: CineMax CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        run: |
          node --check server.js
          node --check app.js
      - name: API smoke test
        run: |
          node server.js > server.log 2>&1 &
          PID=$!
          trap "kill $PID" EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
