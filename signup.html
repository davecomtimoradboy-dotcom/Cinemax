<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CineMax | Sign Up</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><a class="auth-logo" href="index.html">CINE<span>MAX</span></a><main class="auth-screen"><div class="auth-card"><div class="auth-kicker">JOIN CINEMAX</div><h1>Create your account</h1><p>Save movies, build your watchlist and personalize your profile.</p><form id="signupForm"><label>Full name<input id="name" placeholder="Your full name" required></label><label>Email<input id="email" type="email" placeholder="you@example.com" required></label><label>Password<input id="password" type="password" minlength="6" placeholder="At least 6 characters" required></label><button class="primary" type="submit">Create Account</button></form><div class="auth-divider"><span>OR</span></div><button class="google-btn" type="button" disabled>Continue with Google</button><p class="switch-auth">Already have an account? <a href="login.html">Login</a></p><a class="back-home" href="index.html">← Back to CineMax</a></div></main><script>document.getElementById('signupForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Registration failed');localStorage.setItem('cinemax_token',d.token);localStorage.setItem('cinemax_user',JSON.stringify(d.user));location.href='index.html'}catch(err){alert(err.message)}};</script></body></html>
