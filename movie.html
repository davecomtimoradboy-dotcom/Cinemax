<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CineMax Movie</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">CINE<span>MAX</span></div><nav><a href="index.html">Home</a><a href="watchlist.html">Watchlist</a><a href="profile.html">Profile</a></nav></header><main class="movie-page"><div id="movie"></div></main><div class="toast" id="toast"></div><script>
const id=new URLSearchParams(location.search).get("id"),token=localStorage.getItem("cinemax_token");async function load(){const r=await fetch("/api/movies/"+id),m=await r.json();document.getElementById("movie").innerHTML=`<section class="detail-hero" style="background-image:linear-gradient(90deg,#08090d 15%,transparent),url('${m.backdrop}')"><div><span class="eyebrow">${m.genre.toUpperCase()}</span><h1>${m.title}</h1><p>${m.year} • ★ ${m.rating}</p><p>${m.description}</p><button class="primary" onclick="watch()">▶ Watch Now</button><button class="secondary" onclick="fav()">♡ Add to Watchlist</button></div></section>`};async function fav(){if(!token)return location.href="index.html";await fetch("/api/favorites/"+id,{method:"POST",headers:{Authorization:"Bearer "+token}});toast("Added to watchlist")}async function watch(){if(!m.video_url){alert("No authorized video or trailer URL has been added for this movie yet.");return}let p=document.getElementById("player");if(!p){p=document.createElement("section");p.id="player";p.className="player-section";document.querySelector(".detail-hero").after(p)}p.innerHTML='<div class="video-shell"><video id="video" controls playsinline poster="'+m.backdrop+'" src="'+m.video_url+'"></video><p class="muted">Playback uses an authorized video/trailer URL supplied by the administrator.</p></div>';const v=document.getElementById("video");if(token){const q=await fetch("/api/progress/"+id,{headers:{Authorization:"Bearer "+token}}).then(r=>r.json());v.addEventListener("loadedmetadata",()=>{if(q.seconds)v.currentTime=Math.min(q.seconds,v.duration-1)},{once:true});let timer;v.addEventListener("timeupdate",()=>{clearTimeout(timer);timer=setTimeout(()=>fetch("/api/progress/"+id,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({seconds:v.currentTime,duration:v.duration})}),800)})}}function toast(x){document.getElementById("toast").textContent=x;document.getElementById("toast").classList.add("show")}async function submitReview(){if(!token)return location.href="login.html";const text=document.getElementById("reviewText").value.trim();if(!text)return;await fetch("/api/movies/"+id+"/reviews",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({rating:+document.getElementById("reviewRating").value,text})});loadReviews()}async function loadReviews(){const rs=await fetch("/api/movies/"+id+"/reviews").then(r=>r.json());const el=document.getElementById("reviews");if(el)el.innerHTML=rs.map(r=>'<article class="review"><b>'+r.name+'</b> <span class="stars">'+("★".repeat(r.rating))+("☆".repeat(5-r.rating))+'</span><p>'+r.text+'</p></article>').join("")||'<p class="muted">No reviews yet.</p>}loadReviews();load();</script></body></html>
