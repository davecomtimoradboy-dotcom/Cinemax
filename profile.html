<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineMax | Profile</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span>CINE</span>MAX</a><nav class="desktop-nav"><a href="index.html">Home</a><a href="watchlist.html">My List</a><a id="adminLink" href="admin.html" hidden>Admin</a></nav><button class="login-pill" id="logout">Logout</button></header><main><section class="profile-box"><span class="kicker">YOUR ACCOUNT</span><h1>My Profile</h1><p class="muted">Update your profile information.</p><form id="form"><input id="name" placeholder="Name" required><input id="avatar" placeholder="Avatar URL"><textarea id="bio" placeholder="Short bio"></textarea><button class="primary">Save Profile</button></form><p id="status"></p></section><section class="profile-box"><h2>Account</h2><p id="email" class="muted"></p><p id="joined" class="muted"></p></section></main><script>
const token=localStorage.getItem("cinemax_token");if(!token)location.href="login.html";const h={Authorization:"Bearer "+token};
async function load(){const r=await fetch("/api/me",{headers:h});if(!r.ok)return location.href="login.html";const u=await r.json();name.value=u.name;avatar.value=u.avatar||"";bio.value=u.bio||"";email.textContent=u.email;joined.textContent="Joined "+new Date(u.created_at).toLocaleDateString();if(u.role==="admin")adminLink.hidden=false}
form.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/profile",{method:"PUT",headers:{"Content-Type":"application/json",...h},body:JSON.stringify({name:name.value,avatar:avatar.value,bio:bio.value})});const d=await r.json();status.textContent=r.ok?"Profile saved.":d.message||"Could not save";if(r.ok){const old=JSON.parse(localStorage.getItem("cinemax_user")||"{}");localStorage.setItem("cinemax_user",JSON.stringify({...old,...d.user}))}}
logout.onclick=()=>{localStorage.removeItem("cinemax_token");localStorage.removeItem("cinemax_user");location.href="index.html"};load();
</script></body></html>
