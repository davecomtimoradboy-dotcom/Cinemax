<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>My Watchlist | CineMax</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">CINE<span>MAX</span></div><nav><a href="index.html">Home</a><a href="profile.html">Profile</a></nav></header><main><h1>My Watchlist</h1><div class="movie-grid" id="list"></div></main><script>
const token=localStorage.getItem("cinemax_token");async function load(){if(!token)return location.href="index.html";const r=await fetch("/api/favorites",{headers:{Authorization:"Bearer "+token}}),ms=await r.json();document.getElementById("list").innerHTML=ms.map(m=>`<article class="movie-card"><div class="poster" style="background-image:url('${m.poster}')"></div><div class="movie-info"><h3>${m.title}</h3><p>${m.year} • ${m.genre}</p><button onclick="location.href='movie.html?id=${m.id}'">Open</button><button onclick="removeMovie(${m.id})">Remove</button></div></article>`).join("")||"<p>Your watchlist is empty.</p>"}async function removeMovie(id){await fetch("/api/favorites/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});load()}load();</script></body></html>
