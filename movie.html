<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineMax | Movie</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span>CINE</span>MAX</a><nav class="desktop-nav"><a href="index.html">Home</a><a href="watchlist.html">My List</a><a href="profile.html">Profile</a></nav><a class="login-pill" href="index.html">Browse</a></header>
<main><div id="movie"></div><section class="player-section" id="playerSection" hidden></section><section class="review-section" id="reviewSection"><div class="section-head"><div><span class="kicker">COMMUNITY</span><h2>Reviews</h2></div></div><div class="review-form"><select id="reviewRating"><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option></select><textarea id="reviewText" placeholder="Share your thoughts..."></textarea><button class="primary" onclick="submitReview()">Post Review</button></div><div id="reviews"></div></section></main>
<div class="toast" id="toast"></div>
<script>
const id=new URLSearchParams(location.search).get("id");
const token=localStorage.getItem("cinemax_token");
let movie=null,saveTimer=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
async function load(){
 if(!id){document.getElementById("movie").innerHTML="<div class='profile-box'><h1>Movie not found</h1></div>";return}
 const r=await fetch("/api/movies/"+encodeURIComponent(id));if(!r.ok){document.getElementById("movie").innerHTML="<div class='profile-box'><h1>Movie not found</h1></div>";return}
 movie=await r.json();
 document.title="CineMax | "+movie.title;
 document.getElementById("movie").innerHTML='<section class="detail-hero" style="background-image:linear-gradient(90deg,#06070af5 12%,#06070a99 55%,#06070a22),url(\''+esc(movie.backdrop)+'\')"><div><span class="kicker">'+esc(movie.genre.toUpperCase())+'</span><h1>'+esc(movie.title)+'</h1><p>'+movie.year+' • ★ '+movie.rating+'</p><p>'+esc(movie.description)+'</p><div class="hero-actions"><button class="primary" onclick="watch()">▶ Watch Now</button><button class="ghost" onclick="fav()">♡ Add to My List</button></div></div></section>';
 loadReviews();
}
async function fav(){if(!token)return location.href="login.html";const r=await fetch("/api/favorites/"+id,{method:"POST",headers:{Authorization:"Bearer "+token}});toast(r.ok?"Added to My List":"Could not update My List")}
async function watch(){
 if(!movie.video_url){toast("No authorized video or trailer has been added yet.");return}
 const box=document.getElementById("playerSection");box.hidden=false;
 box.innerHTML='<div class="video-shell"><video id="video" controls playsinline preload="metadata" poster="'+esc(movie.backdrop)+'" src="'+esc(movie.video_url)+'"></video><p class="muted">Playback uses an authorized video or trailer URL supplied by the administrator.</p></div>';
 box.scrollIntoView({behavior:"smooth",block:"start"});
 const v=document.getElementById("video");
 if(token){
   try{const q=await fetch("/api/progress/"+id,{headers:{Authorization:"Bearer "+token}}).then(r=>r.json());v.addEventListener("loadedmetadata",()=>{if(q.seconds&&v.duration)v.currentTime=Math.min(q.seconds,Math.max(0,v.duration-1))},{once:true})}catch(e){}
   v.addEventListener("timeupdate",()=>{clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveProgress(v),700)});
   v.addEventListener("pause",()=>saveProgress(v));v.addEventListener("ended",()=>saveProgress(v));
 }
}
async function saveProgress(v){if(!token||!v.duration)return;try{await fetch("/api/progress/"+id,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({seconds:v.currentTime,duration:v.duration})})}catch(e){}}
async function loadReviews(){const r=await fetch("/api/movies/"+id+"/reviews");const rs=r.ok?await r.json():[];document.getElementById("reviews").innerHTML=rs.map(x=>'<article class="review"><div><b>'+esc(x.name)+'</b><span class="stars">'+("★".repeat(x.rating))+("☆".repeat(5-x.rating))+'</span></div><p>'+esc(x.text)+'</p></article>').join("")||'<p class="muted">No reviews yet. Be the first.</p>'}
async function submitReview(){if(!token)return location.href="login.html";const text=document.getElementById("reviewText").value.trim();if(!text)return toast("Write a review first.");const r=await fetch("/api/movies/"+id+"/reviews",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({rating:Number(document.getElementById("reviewRating").value),text})});const d=await r.json();if(!r.ok)return toast(d.message||"Could not save review");document.getElementById("reviewText").value="";toast("Review saved");loadReviews()}
load();
</script></body></html>
