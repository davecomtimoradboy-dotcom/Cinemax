<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Profile | CineMax</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">CINE<span>MAX</span></div><nav><a href="index.html">Home</a><a href="watchlist.html">Watchlist</a><a id="admin" href="admin.html" style="display:none">Admin</a></nav></header><main><section class="profile-box"><h1>My Profile</h1><form id="form"><input id="name" placeholder="Name"><input id="avatar" placeholder="Avatar URL"><textarea id="bio" placeholder="Short bio"></textarea><button class="primary">Save Profile</button></form><p id="status"></p></section></main><script>
const token=localStorage.getItem("cinemax_token");if(!token)location.href="index.html";async function load(){const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+token}}),u=await r.json();name.value=u.name;avatar.value=u.avatar||"";bio.value=u.bio||"";if(u.role==="admin")admin.style.display="inline"}form.onsubmit=async e=>{e.preventDefault();await fetch("/api/profile",{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({name:name.value,avatar:avatar.value,bio:bio.value})});status.textContent="Profile saved."};load();</script></body></html>
