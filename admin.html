<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Admin Dashboard | CineMax</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">CINE<span>MAX</span></div><nav><a href="index.html">Site</a><a href="profile.html">Profile</a></nav></header><main><h1>Admin Dashboard</h1><div class="stats" id="stats"></div><section class="admin-box"><h2>Add Movie</h2><form id="movieForm"><input id="title" placeholder="Title" required><input id="year" type="number" placeholder="Year" required><input id="genre" placeholder="Genre" required><input id="rating" type="number" step=".1" placeholder="Rating"><input id="poster" placeholder="Poster URL" required><input id="backdrop" placeholder="Backdrop URL" required><input id="video_url" placeholder="Licensed video/trailer URL"><textarea id="description" placeholder="Description" required></textarea><label><input id="featured" type="checkbox"> Featured</label><button class="primary">Add Movie</button></form></section><section><h2>Users</h2><div id="users"></div></section></main><script>
const token=localStorage.getItem("cinemax_token");const h={Authorization:"Bearer "+token};async function load(){const s=await fetch("/api/admin/stats",{headers:h});if(!s.ok){document.body.innerHTML="<h1 style='padding:50px'>Admin access required.</h1>";return}const x=await s.json();stats.innerHTML="<div>Users <b>"+x.users+"</b></div><div>Movies <b>"+x.movies+"</b></div><div>Watchlist saves <b>"+x.watchlist+"</b></div>";const u=await fetch("/api/admin/users",{headers:h});users.innerHTML=(await u.json()).map(a=>"<p>"+a.name+" — "+a.email+" — "+a.role+"</p>").join("")}movieForm.onsubmit=async e=>{e.preventDefault();const b={title:title.value,year:+year.value,genre:genre.value,rating:+rating.value,poster:poster.value,backdrop:backdrop.value,video_url:video_url.value,description:description.value,featured:featured.checked};await fetch("/api/admin/movies",{method:"POST",headers:{"Content-Type":"application/json",...h},body:JSON.stringify(b)});movieForm.reset();load()};load();</script></body></html>
