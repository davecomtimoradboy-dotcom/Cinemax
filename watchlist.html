<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineMax | My List</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span>CINE</span>MAX</a><nav class="desktop-nav"><a href="index.html">Home</a><a class="active" href="watchlist.html">My List</a><a href="profile.html">Profile</a></nav><a class="login-pill" href="index.html">Browse</a></header><main><section class="content-section"><div class="section-head"><div><span class="kicker">YOUR COLLECTION</span><h1>My Watchlist</h1></div></div><div class="movie-grid" id="list"></div><div class="empty-state" id="empty" hidden>Your watchlist is empty. Add movies from CineMax.</div></section></main><script>
const token=localStorage.getItem("cinemax_token");if(!token)location.href="login.html";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
async function load(){const r=await fetch("/api/favorites",{headers:{Authorization:"Bearer "+token}});if(r.status===401)return location.href="login.html";const ms=await r.json();document.getElementById("empty").hidden=ms.length>0;document.getElementById("list").innerHTML=ms.map(m=>'<article class="movie-card"><a class="poster" href="movie.html?id='+m.id+'" style="background-image:url(\''+esc(m.poster)+'\')"><span class="rating">★ '+m.rating+'</span></a><div class="movie-info"><h3>'+esc(m.title)+'</h3><p>'+m.year+' • '+esc(m.genre)+'</p><div class="card-actions"><button onclick="location.href=\'movie.html?id='+m.id+'\'">Open</button><button onclick="removeMovie('+m.id+')">Remove</button></div></div></article>').join("")}
async function removeMovie(id){await fetch("/api/favorites/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});load()}load();
</script></body></html>
